[package]
name = "vibery"
version = "0.1.0"
edition = "2021"
description = "A fast, expressive search backend for Fibery-shaped knowledge graphs"

[dependencies]
tantivy = "0.22"
redb = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
anyhow = "1"
bincode = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
rustc-hash = "2"
memchr = "2"
rustyline = "14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
